META_ARC: "siamcar_r50"

BACKBONE:
    TYPE: "swin transformer" # "resnet50"
    KWARGS:
        out_layers: [3]
        #width_mult: 1 # alexnet
    PRETRAINED: 'D:/pycharmProject/pythonProject1/coding/MySiamCAR/pretrained_model/swin_base_patch4_window7_224_22k.pth'
    TRAIN_LAYERS: ['layer1', 'layer2', 'layer3']
    TRAIN_EPOCH: 0
    LAYERS_LR: 0.1

ADJUST:
    ADJUST: true
    TYPE: "AdjustLayer"
    KWARGS:
        in_channels:  384 # resnet50 [512, 1024, 2048] resnet34 512
        out_channels: 256 # resnet50 [256, 256, 256]

TRACK:
    TYPE: 'SiamCARTracker'
    PENALTY_K: 0.3
    WINDOW_INFLUENCE: 0.0
    XY_WINDOW_INFLUENCE: 0.4
    XZ_WINDOW_INFLUENCE: 0.4
    YZ_WINDOW_INFLUENCE: 0.4
    LR: 0.4
    EXEMPLAR_SIZE: 127
    INSTANCE_SIZE: 255
    INIT_CONTEXT_AMOUNT: 0.4
    CONTEXT_AMOUNT: 0.15
    SCORE_SIZE: 16
    STRIDE: 16


#NECK:
    #TYPE: 'Attn'

TRAIN:
    EPOCH: 10
    START_EPOCH: 0
    SAVE_EPOCH: 50
    BATCH_SIZE: 64 # 32
    BASE_LR: &BASE_LR 0.01
    CLS_WEIGHT: 1.0
    LOC_WEIGHT: 3.0
    CEN_WEIGHT: 1.0
    RESUME: ''
    NUM_CLASSES: 2
    NUM_CONVS: 4
    PRIOR_PROB: 0.01
    OUTPUT_SIZE: 16 # resnet_other: 25
    OFFSET: 7
    SNAPSHOT_DIR: './snapshot'


#    LR:
#        TYPE: 'multi-step'
#        KWARGS:
#            start_lr: *BASE_LR
#            steps: [2, 4]
#            #end_lr: 0.00001

    LR_SCHEDULER:
        TYPE: 'Exponential'
        KWARGS:
            gamma: 0.97

    LR_WARMUP:
        TYPE: 'linear'
        EPOCH: 5
        KWARGS:
            start_lr: 0.001
            end_lr: 0.005
            step: 1

DATASET:
    NAMES:
    - 'CLUST'
    #- 'GOT'
    #- 'CLUST_SUPPLY'
    # - 'CLUST_AUG'
    NUM: 200
    ROOT: "D:/DataSet/MICCAI_CLUST_2015_TestSet_3D/MICCAI_CLUST_2015_TestSet_3D"
    JSON_PATH: 'D:/pycharmProject/pythonProject1/coding/3dTracking/dataset/3d_dataset/track_test.json'

    RANDOM_RANGE: 12
    IMG_SIZE: 32
    NORMALIZE: true
    METHOD: '3d'
    IN_CHANNELS: 1
    CHANNELS_24_DIRECTION: 'z'

    TEMPLATE:
        SHIFT: 4
        SCALE: 0.05
        BLUR: 0.0
        FLIP: 0.2

    SEARCH:
        SHIFT: 64
        SCALE: 0.18
        BLUR: 0.0
        FLIP: 0.8

    NEG: 0.0
    GRAY: 0.0

META_ARC: "siamcar_r50"


#NECK:
    #TYPE: 'Attn'

TRAIN:
    EPOCH: 10
    START_EPOCH: 0
    SAVE_EPOCH: 50
    BATCH_SIZE: 64 # 32
    BASE_LR: &BASE_LR 0.01
    CLS_WEIGHT: 1.0
    LOC_WEIGHT: 3.0
    CEN_WEIGHT: 1.0
    RESUME: ''
    NUM_CLASSES: 2
    NUM_CONVS: 4
    PRIOR_PROB: 0.01
    OUTPUT_SIZE: 16 # resnet_other: 25
    OFFSET: 7
    SNAPSHOT_DIR: './snapshot'



    LR_SCHEDULER:
        TYPE: 'Exponential'
        KWARGS:
            gamma: 0.97

    LR_WARMUP:
        TYPE: 'linear'
        EPOCH: 5
        KWARGS:
            start_lr: 0.001
            end_lr: 0.005
            step: 1

DATASET:
    NAMES:
    - 'CLUST'
    #- 'GOT'
    #- 'CLUST_SUPPLY'
    # - 'CLUST_AUG'
    NUM: 200
    ROOT: "D:/DataSet/MICCAI_CLUST_2015_TestSet_3D/MICCAI_CLUST_2015_TestSet_3D"
    JSON_PATH: 'D:/pycharmProject/pythonProject1/coding/3dTracking/dataset/3d_dataset/track_test.json'
    LABEL_PATH: "D:/pycharmProject/pythonProject1/coding/3dTracking/dataset/3d_dataset/test_label.json"
    IMG_SIZE: 32
    NORMALIZE: true
    METHOD: '2d'
    IN_CHANNELS: 9
    CHANNELS_24_DIRECTION: 'z'

    TEMPLATE:
        SHIFT: 4
        SCALE: 0.05
        BLUR: 0.0
        FLIP: 0.2

    SEARCH:
        SHIFT: 64
        SCALE: 0.18
        BLUR: 0.0
        FLIP: 0.8

    NEG: 0.0
    GRAY: 0.0

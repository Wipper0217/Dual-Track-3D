META_ARC: "moco_resnet50"

MOCO:
    KWARGS:
        input_dim: 2048
        mlp_dim: 2048
        output_dim: 256
        t: 0.2
        momentum: 0.999
        queue_size: 1024

TRACKER:
    LAMBDA_SPATIAL: 0.001
    LAMBDA_AUTOENCODER: 1.0
    LAMBDA_ENCODER: 1.0
    MODE: 'normal'

TRAIN:
    EPOCH: 300
    START_EPOCH: 0
    SAVE_EPOCH: 50
    BATCH_SIZE: 16
    WEIGHT_DECAY: 0.0001
    MOMENTUM: 0.9
    PRINT_FREQ: 10
    RESUME: ''

    SNAPSHOT_DIR: '/root/data-tmp/core-track/snapshot/moco_resnet50'

    LR:
        LR: 0.0005
        COS: true

    LR_SCHEDULER:
        TYPE: 'CosineAnnealing'
        KWARGS:
            T_max: 300
            eta_min: 0.00001

DATASET:
    NUM: 12800
    ROOT: "/root/data-pub/ultrasound/3DUS/CLUST/clust_testset_3d"
    JSON_PATH: '/root/data-pub/ultrasound/3DUS/CLUST/clust_testset_3d/test.json'
    LABEL_PATH: "/root/data-pub/ultrasound/3DUS/CLUST/clust_testset_3d/test_label.json"
    RANDOM_RANGE: 12
    IMG_SIZE: 64
    NORMALIZE: false
    METHOD: '3d'
    IN_CHANNELS: 1

ENCODER:
    TYPE: 'resnet50'
    KWARGS:
        in_channels: 1
